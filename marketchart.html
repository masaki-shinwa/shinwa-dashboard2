const MC_TF_LABELS = {"5m": "5分足", "15m": "15分足", "30m": "30分足", "60m": "1時間足"};
const mcCharts = {};

function mcMarkerPlugin() {
  return {
    id: 'mcMarkerPlugin',
    afterDatasetsDraw(chart) {
      const markers = chart.$mcMarkers || [];
      const xScale = chart.scales.x, yScale = chart.scales.y;
      const ctx = chart.ctx;
      markers.forEach(m => {
        const x = xScale.getPixelForValue(m.x);
        if (x === undefined || isNaN(x)) return;
        const yBase = yScale.getPixelForValue(m.price);
        const up = m.type === 'up';
        const y = up ? yBase + 16 : yBase - 16;
        ctx.save();
        ctx.fillStyle = up ? '#34d399' : '#f87171';
        ctx.beginPath();
        if (up) {
          ctx.moveTo(x, y + 7); ctx.lineTo(x - 6, y - 7); ctx.lineTo(x + 6, y - 7);
        } else {
          ctx.moveTo(x, y - 7); ctx.lineTo(x - 6, y + 7); ctx.lineTo(x + 6, y + 7);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      });
    }
  };
}

function mcRenderPair(code, tf) {
  const safeId = code.replace('US.', '').toLowerCase();
  const d = MC_DATA[code][tf];
  const candleCtx = document.getElementById('candle_' + safeId).getContext('2d');
  const stochCtx = document.getElementById('stoch_' + safeId).getContext('2d');

  if (mcCharts[safeId + '_candle']) mcCharts[safeId + '_candle'].destroy();
  if (mcCharts[safeId + '_stoch']) mcCharts[safeId + '_stoch'].destroy();

  const candleChart = new Chart(candleCtx, {
    type: 'candlestick',
    data: { datasets: [{
      label: code.replace('US.', '') + ' ' + MC_TF_LABELS[tf],
      data: d.candles.map(c => ({ x: c.x, o: c.o, h: c.h, l: c.l, c: c.c })),
      color: { up: '#34d399', down: '#f87171', unchanged: '#9ca3af' },
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      parsing: false,
      scales: {
        x: { type: 'linear', min: 0, max: d.labels.length - 1,
             ticks: { color: '#888', maxRotation: 0, autoSkip: true,
                      callback: v => d.labels[v] || '' },
             grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } },
      },
      plugins: { legend: { labels: { color: '#ccc' } } },
    },
    plugins: [mcMarkerPlugin()],
  });
  candleChart.$mcMarkers = d.markers;
  candleChart.update();

  const lastIdx = d.labels.length - 1;
  const line80 = [{ x: 0, y: 80 }, { x: lastIdx, y: 80 }];
  const line20 = [{ x: 0, y: 20 }, { x: lastIdx, y: 20 }];
  const stochChart = new Chart(stochCtx, {
    type: 'line',
    data: { datasets: [
      { label: '%K', data: d.k, borderColor: '#60a5fa', pointRadius: 0, borderWidth: 1.5, tension: 0 },
      { label: '%D', data: d.d, borderColor: '#fbbf24', pointRadius: 0, borderWidth: 1.5, tension: 0 },
      { label: '買われすぎ80', data: line80, borderColor: 'rgba(248,113,113,.6)', borderDash: [5,4], borderWidth: 1, pointRadius: 0 },
      { label: '売られすぎ20', data: line20, borderColor: 'rgba(52,211,153,.6)', borderDash: [5,4], borderWidth: 1, pointRadius: 0 },
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      parsing: false,
      scales: {
        x: { type: 'linear', min: 0, max: lastIdx, ticks: { display: false }, grid: { color: '#222' } },
        y: { min: 0, max: 100, ticks: { color: '#888', stepSize: 20 }, grid: { color: '#222' } },
      },
      plugins: { legend: { labels: { color: '#ccc', filter: item => item.text === '%K' || item.text === '%D' } } },
    },
  });

  mcCharts[safeId + '_candle'] = candleChart;
  mcCharts[safeId + '_stoch'] = stochChart;
}

function mcSwitchTf(btn) {
  const code = btn.getAttribute('data-code');
  const tf = btn.getAttribute('data-tf');
  document.querySelectorAll('.tfbar[data-code="' + code + '"] .tfbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mcRenderPair(code, tf);
}

Object.keys(MC_DATA).forEach(code => mcRenderPair(code, '15m'));
