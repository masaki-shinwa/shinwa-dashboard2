<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>QQQ/SPY/SOXX チャート</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#eee;margin:0;padding:16px;}
.head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.htitle{font-size:19px;font-weight:700;}
.back{font-size:11px;font-weight:700;color:#fff;background:#378add;border-radius:14px;
      padding:5px 11px;text-decoration:none;margin-left:auto;}
.sub{color:#999;font-size:12px;margin-bottom:14px;}
.panel{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px 14px;margin-bottom:16px;}
.ptitle{font-size:15px;font-weight:700;color:#e6a8d8;margin-bottom:10px;}
.ptitle .pnote{font-size:10px;font-weight:400;color:#888;margin-left:6px;}
.tfbar{display:flex;gap:6px;margin-bottom:10px;}
.tfbtn{font-size:11px;font-weight:600;color:#bbb;background:#1a1a1a;border:1px solid #333;
       border-radius:8px;padding:5px 12px;cursor:pointer;}
.tfbtn.active{color:#0d0d0d;background:#378add;border-color:#378add;}
.mcchart{position:relative;height:280px;margin-bottom:8px;}
.mcstoch{height:120px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:11px;color:#999;}
</style></head><body>
<div class="head"><span class="htitle">📈 QQQ/SPY/SOXX チャート</span>
<a class="back" href="index.html">🧭 司令塔に戻る</a></div>
<div class="sub">更新 08/18 06:13 JST／15分足・30分足・1時間足切替／ストキャスティクス（%K・%D、期間14／平滑化3・3）80以上＝買われすぎ・20以下＝売られすぎ</div>
<div class="legend">
<span>▲＝売られすぎ→買われすぎクロス（買いシグナル）</span>
<span>▼＝買われすぎ→売られすぎクロス（売りシグナル）</span>
</div>
<div class="panel">
<div class="ptitle">QQQ <span class="pnote">ローソク足＋ストキャスティクス（%K・%D、期間14／平滑化3・3）</span></div>
<div class="tfbar" data-code="US.QQQ"><button class="tfbtn" data-code="US.QQQ" data-tf="5m" onclick="mcSwitchTf(this)">5分足</button><button class="tfbtn active" data-code="US.QQQ" data-tf="15m" onclick="mcSwitchTf(this)">15分足</button><button class="tfbtn" data-code="US.QQQ" data-tf="30m" onclick="mcSwitchTf(this)">30分足</button><button class="tfbtn" data-code="US.QQQ" data-tf="60m" onclick="mcSwitchTf(this)">1時間足</button></div>
<div class="mcchart"><canvas id="candle_qqq"></canvas></div>
<div class="mcchart mcstoch"><canvas id="stoch_qqq"></canvas></div>
</div><div class="panel">
<div class="ptitle">SPY <span class="pnote">ローソク足＋ストキャスティクス（%K・%D、期間14／平滑化3・3）</span></div>
<div class="tfbar" data-code="US.SPY"><button class="tfbtn" data-code="US.SPY" data-tf="5m" onclick="mcSwitchTf(this)">5分足</button><button class="tfbtn active" data-code="US.SPY" data-tf="15m" onclick="mcSwitchTf(this)">15分足</button><button class="tfbtn" data-code="US.SPY" data-tf="30m" onclick="mcSwitchTf(this)">30分足</button><button class="tfbtn" data-code="US.SPY" data-tf="60m" onclick="mcSwitchTf(this)">1時間足</button></div>
<div class="mcchart"><canvas id="candle_spy"></canvas></div>
<div class="mcchart mcstoch"><canvas id="stoch_spy"></canvas></div>
</div><div class="panel">
<div class="ptitle">SOXX <span class="pnote">ローソク足＋ストキャスティクス（%K・%D、期間14／平滑化3・3）</span></div>
<div class="tfbar" data-code="US.SOXX"><button class="tfbtn" data-code="US.SOXX" data-tf="5m" onclick="mcSwitchTf(this)">5分足</button><button class="tfbtn active" data-code="US.SOXX" data-tf="15m" onclick="mcSwitchTf(this)">15分足</button><button class="tfbtn" data-code="US.SOXX" data-tf="30m" onclick="mcSwitchTf(this)">30分足</button><button class="tfbtn" data-code="US.SOXX" data-tf="60m" onclick="mcSwitchTf(this)">1時間足</button></div>
<div class="mcchart"><canvas id="candle_soxx"></canvas></div>
<div class="mcchart mcstoch"><canvas id="stoch_soxx"></canvas></div>
</div>
<script>
const MC_DATA = {"US.QQQ": {"5m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "15m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "30m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "60m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}}, "US.SPY": {"5m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "15m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "30m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "60m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}}, "US.SOXX": {"5m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "15m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "30m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}, "60m": {"candles": [], "k": [], "d": [], "markers": [], "labels": []}}};
const MC_TF_LABELS = {"5m": "5分足", "15m": "15分足", "30m": "30分足", "60m": "1時間足"};
const mcCharts = {};

function mcMarkerPlugin() {
  return {
    id: 'mcMarkerPlugin',
    afterDatasetsDraw(chart) {
      const markers = chart.$mcMarkers || [];
      const xScale = chart.scales.x, yScale = chart.scales.y;
      const ctx = chart.ctx;
      markers.forEach(m => {
        const x = xScale.getPixelForValue(m.x);
        if (x === undefined || isNaN(x)) return;
        const yBase = yScale.getPixelForValue(m.price);
        const up = m.type === 'up';
        const y = up ? yBase + 16 : yBase - 16;
        ctx.save();
        ctx.fillStyle = up ? '#34d399' : '#f87171';
        ctx.beginPath();
        if (up) {
          ctx.moveTo(x, y + 7); ctx.lineTo(x - 6, y - 7); ctx.lineTo(x + 6, y - 7);
        } else {
          ctx.moveTo(x, y - 7); ctx.lineTo(x - 6, y + 7); ctx.lineTo(x + 6, y + 7);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      });
    }
  };
}

function mcRenderPair(code, tf) {
  const safeId = code.replace('US.', '').toLowerCase();
  const d = MC_DATA[code][tf];
  const candleCtx = document.getElementById('candle_' + safeId).getContext('2d');
  const stochCtx = document.getElementById('stoch_' + safeId).getContext('2d');

  if (mcCharts[safeId + '_candle']) mcCharts[safeId + '_candle'].destroy();
  if (mcCharts[safeId + '_stoch']) mcCharts[safeId + '_stoch'].destroy();

  const candleChart = new Chart(candleCtx, {
    type: 'candlestick',
    data: { datasets: [{
      label: code.replace('US.', '') + ' ' + MC_TF_LABELS[tf],
      data: d.candles.map(c => ({ x: c.x, o: c.o, h: c.h, l: c.l, c: c.c })),
      color: { up: '#34d399', down: '#f87171', unchanged: '#9ca3af' },
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      parsing: false,
      scales: {
        x: { type: 'linear', min: 0, max: d.labels.length - 1,
             ticks: { color: '#888', maxRotation: 0, autoSkip: true,
                      callback: v => d.labels[v] || '' },
             grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } },
      },
      plugins: { legend: { labels: { color: '#ccc' } } },
    },
    plugins: [mcMarkerPlugin()],
  });
  candleChart.$mcMarkers = d.markers;
  candleChart.update();

  const lastIdx = d.labels.length - 1;
  const line80 = [{ x: 0, y: 80 }, { x: lastIdx, y: 80 }];
  const line20 = [{ x: 0, y: 20 }, { x: lastIdx, y: 20 }];
  const stochChart = new Chart(stochCtx, {
    type: 'line',
    data: { datasets: [
      { label: '%K', data: d.k, borderColor: '#60a5fa', pointRadius: 0, borderWidth: 1.5, tension: 0 },
      { label: '%D', data: d.d, borderColor: '#fbbf24', pointRadius: 0, borderWidth: 1.5, tension: 0 },
      { label: '買われすぎ80', data: line80, borderColor: 'rgba(248,113,113,.6)', borderDash: [5,4], borderWidth: 1, pointRadius: 0 },
      { label: '売られすぎ20', data: line20, borderColor: 'rgba(52,211,153,.6)', borderDash: [5,4], borderWidth: 1, pointRadius: 0 },
    ] },
    options: {
      responsive: true, maintainAspectRatio: false,
      parsing: false,
      scales: {
        x: { type: 'linear', min: 0, max: lastIdx, ticks: { display: false }, grid: { color: '#222' } },
        y: { min: 0, max: 100, ticks: { color: '#888', stepSize: 20 }, grid: { color: '#222' } },
      },
      plugins: { legend: { labels: { color: '#ccc', filter: item => item.text === '%K' || item.text === '%D' } } },
    },
  });

  mcCharts[safeId + '_candle'] = candleChart;
  mcCharts[safeId + '_stoch'] = stochChart;
}

function mcSwitchTf(btn) {
  const code = btn.getAttribute('data-code');
  const tf = btn.getAttribute('data-tf');
  document.querySelectorAll('.tfbar[data-code="' + code + '"] .tfbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mcRenderPair(code, tf);
}

Object.keys(MC_DATA).forEach(code => mcRenderPair(code, '15m'));
</script>
</body></html>
