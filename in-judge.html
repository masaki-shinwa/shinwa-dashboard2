<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  background: #0d0d0d;
  color: #eee;
  padding: 16px;
  margin: 0;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.header h1 {
  font-size: 18px;
  font-weight: 500;
  margin: 0;
}
.header .updated {
  font-size: 12px;
  color: #888;
}
.nav {
  display: block;
  margin-bottom: 16px;
  font-size: 13px;
}
.nav a {
  color: #4ade80;
  text-decoration: none;
  margin-right: 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.card {
  background: #1a1a1a;
  border-radius: 12px;
  padding: 14px;
  border: 1px solid #2a2a2a;
}
.card.rank-s { border: 2px solid #e24b4a; }
.card.rank-a { border: 2px solid #ba7517; }
.card.rank-b { border: 1px solid #444441; }
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.ticker {
  font-weight: 500;
  font-size: 14px;
}
.rank-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
}
.rank-badge.rank-s { background: #501313; color: #f7c1c1; }
.rank-badge.rank-a { background: #412402; color: #fac775; }
.rank-badge.rank-b { background: #2c2c2a; color: #b4b2a9; }
.sub {
  font-size: 12px;
  color: #888;
  margin: 0 0 8px;
}
table.info {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
  margin-bottom: 8px;
}
table.info td {
  padding: 2px 0;
  color: #aaa;
}
table.info td.val {
  text-align: right;
  color: #eee;
}
table.info td.val.positive { color: #97c459; }
table.info td.val.negative { color: #f09595; }
.in-section {
  border-top: 1px solid #2a2a2a;
  padding-top: 8px;
}
.in-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 12px;
  color: #aaa;
}
.in-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 6px;
}
.in-badge.in-ok { background: #173404; color: #97c459; }
.in-badge.in-wait { background: #2c2c2a; color: #b4b2a9; }
.in-badge.in-ng { background: #2c2c2a; color: #5f5e5a; }
.empty {
  color: #888;
  font-size: 13px;
  grid-column: 1 / -1;
}
